services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobpulse
      POSTGRES_PASSWORD: jobpulse
      POSTGRES_DB: jobpulse
    ports:
      # Host 5433 avoids clashing with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - jobpulse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpulse -d jobpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380 avoids clashing with a local Redis on 6379
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - jobpulse_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/jobpulse || true;
      mc anonymous set download local/jobpulse/public || true;
      printf '%s' '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:3000\",\"http://127.0.0.1:3000\",\"http://localhost:3001\",\"http://10.0.0.156:3000\",\"http://10.0.0.156:3001\",\"http://10.0.0.180:3000\",\"http://10.0.0.180:3001\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"POST\",\"HEAD\",\"DELETE\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\",\"Content-Length\"],\"MaxAgeSeconds\":3600}]}' > /tmp/cors.json;
      mc cors set /tmp/cors.json local/jobpulse || true;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  jobpulse_pg:
  jobpulse_minio:
