services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobbpulse
      POSTGRES_PASSWORD: jobbpulse
      POSTGRES_DB: jobbpulse
    ports:
      - "5433:5432"
    volumes:
      - jp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbpulse -d jobbpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - jp_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/jobbpulse || true &&
      mc anonymous set download local/jobbpulse || true
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://jobbpulse:jobbpulse@postgres:5432/jobbpulse
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      # Browser/phone uploads: use host-reachable MinIO (override to your LAN IP for mobile)
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      # Desktop + common LAN Nuxt origins (add your phone-facing LAN IP if missing)
      # Nuxt may fall through 3000→3001→3002 when ports are busy; include common dev ports + LAN IPs for QR mobile
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003,http://10.0.0.156:3000,http://10.0.0.156:3001,http://10.0.0.156:3002,http://10.0.0.156:3003,http://10.0.0.180:3000,http://10.0.0.180:3001,http://10.0.0.180:3002,http://10.0.0.180:3003}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      APP_ENV: development
      AUTH_DEV_CODES: "true"
      PROVIDER_MODE: fake
      PIPELINE_STAGE_DELAY_SECONDS: "2.5"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts
      - ./backend/tests:/app/tests

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://jobbpulse:jobbpulse@postgres:5432/jobbpulse
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      APP_ENV: development
      AUTH_DEV_CODES: "true"
      PROVIDER_MODE: fake
      PIPELINE_STAGE_DELAY_SECONDS: "2.5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A app.tasks.celery_app.celery_app worker -l info
    volumes:
      - ./backend/app:/app/app

volumes:
  jp_pg:
  jp_minio:
